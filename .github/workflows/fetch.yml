name: Fetch nekocloud subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run subscription fetcher
        run: |
          php -S 127.0.0.1:8080 >/tmp/php-server.log 2>&1 &
          sleep 2
          curl -s --max-time 60 http://127.0.0.1:8080/index.php -o subscription.txt
          echo "--- subscription head ---"
          head -c 500 subscription.txt
          echo ""
          kill %1 || true

      - name: Commit subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription.txt
          git diff --cached --quiet || git commit -m "Update subscription $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
